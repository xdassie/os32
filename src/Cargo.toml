[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
path = "kernel.rs"

[dependencies]
uart_16550 = { version = "0.8", default-features = false }
pc-keyboard = { version = "0.9", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "lazy"] }
